<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#1F2C3F" />
    <title>Sem conexão — Pax Shalom</title>
    <style>
      :root { color-scheme: light; font-family: "DM Sans", Arial, sans-serif; background: #FCF8F5; color: #1F2C3F; }
      body { min-height: 100vh; margin: 0; display: grid; place-items: center; padding: 24px; box-sizing: border-box; }
      main { max-width: 420px; padding: 32px; text-align: center; border: 1px solid #B39263; border-radius: 20px; background: #fff; }
      .monogram { width: 76px; height: 76px; margin: 0 auto 20px; display: grid; place-items: center; border: 2px solid #B39263; border-radius: 50%; font: 600 28px Georgia, serif; }
      h1 { margin: 0 0 12px; font: 600 28px Georgia, serif; }
      p { margin: 0; line-height: 1.6; color: #586274; }
    </style>
  </head>
  <body>
    <main>
      <div class="monogram" aria-hidden="true">PS</div>
      <h1>Sem conexão</h1>
      <p>Conecte-se à internet para abrir esta tela. Depois, você poderá consultar as telas já visitadas enquanto estiver offline.</p>
    </main>
  </body>
</html>
